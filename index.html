<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pack 828">
<meta name="description" content="Pack 828 families and leaders: calendar, announcements, to-dos, scout accounts, advancement and expenses.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-96.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&display=swap" rel="stylesheet">
<title>Pack 828</title>
<style>
:root{
  --navy:#0033A0; --deep:#0A1F4D; --gold:#F2AA00; --gold-soft:#FFF4D6; --green:#00833D; --green-soft:#E3F3EA;
  --paper:#F3F5F9; --surface:#FFFFFF; --ink:#13213F; --muted:#5A6683; --line:#DCE2EC; --red:#B42318; --red-soft:#FDECEA;
  --display:"Bitter", Georgia, "Times New Roman", serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --nav-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0C1428; --surface:#141E38; --ink:#E8EDF7; --muted:#9AA7C2; --line:#25314F;
    --gold-soft:#3A2F10; --green-soft:#0F2E20; --red-soft:#3A1614; color-scheme: dark; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--navy)}
@media (prefers-color-scheme: dark){ a{color:#8FB1FF} }
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;border-bottom:3px solid var(--gold);
  padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.top h1{font-size:20px;font-weight:800;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:inherit;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:20px 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--gold-soft);font-size:14px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:0 4px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--navy);font-weight:600}
@media (prefers-color-scheme: dark){ .nav button[aria-current="page"]{color:var(--gold)} }
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-weight:700}

/* Greeting + next-up trail sign (the one bold element) */
.hello{font-size:26px;font-weight:800;margin:4px 0 16px}
.sign{position:relative;display:block;width:100%;text-align:left;border:0;cursor:pointer;color:#14213F;
  background:var(--gold);padding:16px 64px 16px 18px;border-radius:8px 0 0 8px;
  clip-path:polygon(0 0, calc(100% - 34px) 0, 100% 50%, calc(100% - 34px) 100%, 0 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.sign .when{font-size:14px;font-weight:600;opacity:.85}
.sign h2{font-size:24px;font-weight:800;margin:2px 0 4px}
.sign .where{font-size:14px}
.sign-post{width:10px;height:18px;margin-left:28px;background:#6B4A1E;border-radius:0 0 2px 2px}
.empty-sign{padding:16px;border:2px dashed var(--line);border-radius:10px;color:var(--muted)}

/* Quick actions */
.quick{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;
  border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);font-weight:600;text-decoration:none;cursor:pointer}
@media (prefers-color-scheme: dark){ .btn{border-color:#5B7FD6;color:#C9D7FF} }
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}

/* Sections + lists */
section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-head h2{font-size:19px;font-weight:700}
.link{background:none;border:0;color:var(--navy);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
@media (prefers-color-scheme: dark){ .link{color:#8FB1FF} }
.list{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:14px;color:var(--muted)}
.row .body{white-space:pre-wrap;margin-top:4px;font-size:15px}
.pin{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--gold);margin-right:6px;vertical-align:middle}
.none{padding:16px;color:var(--muted);font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.wait{background:var(--gold-soft);color:#7A5300}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:#E5ECFA;color:var(--navy)}
@media (prefers-color-scheme: dark){ .pill.wait{color:#FFCF5C} .pill.ok{color:#5FD08E} .pill.info{background:#1C2B52;color:#C9D7FF} }

/* Advancement by rank */
.rank-group{margin:0 0 12px}
.rank-group summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;padding:10px 2px}
.rank-group summary::-webkit-details-marker{display:none}
.rank-group summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
.rank-group[open] summary::before{transform:rotate(45deg)}
.rg-title{font-family:var(--display);font-weight:700;font-size:19px;flex:1}
.mark{flex:none;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.mark.done{background:var(--green);color:#fff}
.mark.part{border:2px solid var(--gold);color:var(--ink)}

/* Checkbox rows */
.check{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;margin:0;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.check:checked{background:var(--green);border-color:var(--green)}
.check:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}

/* Calendar */
.month{font-size:15px;font-weight:700;color:var(--muted);margin:24px 0 8px}
.month:first-child{margin-top:0}
.datebox{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--paper);padding:6px 0}
.datebox b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;color:var(--navy)}
@media (prefers-color-scheme: dark){ .datebox b{color:var(--gold)} }
.datebox span{font-size:12px;color:var(--muted)}

/* Money */
.bal{display:flex;justify-content:space-between;align-items:center;gap:12px}
.amt{font-family:var(--display);font-weight:800;font-size:28px;color:var(--green);white-space:nowrap}
.amt.neg{color:var(--red)}
.amt.sm{font-size:18px;color:var(--ink)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
@media (prefers-color-scheme: dark){ .bar i{background:var(--gold)} }

/* Scouts */
.scout-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scout-head h2{font-size:26px;font-weight:800}
.rank{color:var(--muted);font-size:15px}
.stat{display:flex;gap:10px;margin-top:12px}
.stat div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:26px;color:var(--navy)}
@media (prefers-color-scheme: dark){ .stat b{color:var(--gold)} }
.stat span{font-size:13px;color:var(--muted)}
select.picker{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,30,.5);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:18px 18px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.scrim.open{display:block}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:21px;margin-bottom:12px}
@media (prefers-reduced-motion: reduce){ .sheet{transition:none} }

/* Forms */
label.f{display:block;margin:0 0 14px}
label.f > span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.in{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-height:46px}
textarea.in{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.picklist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.picklist label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.picklist label:first-child{border-top:0}
.picklist .grp{padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted);background:var(--paper)}
.thumb{max-width:100%;max-height:220px;border-radius:10px;margin:0 0 14px;display:block}
.err{color:var(--red);font-size:14px;margin:0 0 12px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:15px;max-width:90vw;display:none}
.toast.show{display:block}

/* Login */
.login{min-height:100vh;background:var(--deep);color:#fff;display:flex;flex-direction:column;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.login .logo{width:132px;height:132px;border-radius:66px;background:#fff;display:block;margin:0 auto 18px;object-fit:contain;border:4px solid var(--gold)}
.login h1{font-size:34px;text-align:center;font-weight:800}
.login p.sub{text-align:center;opacity:.85;margin:6px 0 28px}
.login form{max-width:400px;width:100%;margin:0 auto}
.login .in{background:#fff;color:#13213F;border:0;font-size:18px}
.login .btn.primary{background:var(--gold);border-color:var(--gold);color:#14213F;width:100%;margin-top:4px}
.login .link{color:#fff;display:block;margin:14px auto 0}
.login .msg{min-height:24px;text-align:center;margin-top:14px;font-size:15px}
.gbtn{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;opacity:.8;font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.35)}
.login .tip{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 18px}
.code-in{letter-spacing:.4em;text-align:center;font-family:var(--display);font-size:26px !important}
.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab"></div><div class="wrap" id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Paste the Apps Script web app URL (ends in /exec) here ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxt6d8Vl0sCa9zgg9MFU4XHWBNr6vsfiB_lAnYaKzbYrUzRZCfvQGtVsIS222Mi5QmC/exec';
const APP_VERSION = '1.5.1';
/* Optional: paste the OAuth Web client ID to turn on "Sign in with Google" (see SETUP.md) */
const GOOGLE_CLIENT_ID = '254734641252-lap60rn8kjltr0eh4q7mrd8lvml9bphd.apps.googleusercontent.com';
const googleOn = () => GOOGLE_CLIENT_ID.indexOf('PASTE_') !== 0;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const S = {
  token: localStorage.getItem('p828.token') || '',
  data: null, tab: 'home', sub: null, scout: localStorage.getItem('p828.scout') || '',
  syncing: false, offline: false, lastSync: Number(localStorage.getItem('p828.lastSync') || 0),
  expFilter: 'review', loginStep: 'email', loginEmail: '', installEvt: null
};
try { S.data = JSON.parse(localStorage.getItem('p828.data') || 'null'); } catch (e) { S.data = null; }

/* ---------- Utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const money = n => (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const ymd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const first = n => String(n || '').trim().split(/\s+/)[0];
const D = () => S.data || {};
const U = () => D().user || {};

function fmtDay(d, opts) { return d.toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtTime(d) { return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function shortDate(s) { return s ? fmtDay(ymd(s), { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function evStart(ev) { return ev.allDay ? ymd(ev.start) : new Date(ev.start); }
function evEnd(ev) { return ev.allDay ? new Date(ymd(ev.end).getTime() - 1) : new Date(ev.end); }
function dayWord(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return fmtDay(d, { weekday: 'long', month: 'short', day: 'numeric' });
}
function whenText(ev) {
  const s = evStart(ev);
  if (ev.allDay) {
    const e = evEnd(ev);
    return (s.toDateString() === e.toDateString()) ? dayWord(s) + ', all day' : dayWord(s) + ' to ' + fmtDay(e);
  }
  return dayWord(s) + ' at ' + fmtTime(s);
}
function upcoming() { const now = new Date(); return (D().events || []).filter(e => evEnd(e) >= now); }
function fiscalStart() {
  const m = D().fiscalStartMonth || 8, t = new Date();
  return new Date(t.getMonth() + 1 >= m ? t.getFullYear() : t.getFullYear() - 1, m - 1, 1);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  scout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 15.5 6.7 18.4l1.2-6L3.4 8.3l6-.7z"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M16 15h2"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ---------- API ---------- */
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {}))
  });
  const j = await res.json();
  if (!j.ok) {
    if (j.code === 'AUTH') { signOutLocal(); throw new Error(j.error); }
    throw new Error(j.error || 'Something went wrong. Try again.');
  }
  return j;
}

async function refresh(quiet) {
  if (!S.token || S.syncing) return;
  S.syncing = true; renderTop();
  try {
    const d = await api('bootstrap');
    S.data = d; S.offline = false; S.lastSync = Date.now();
    localStorage.setItem('p828.data', JSON.stringify(d));
    localStorage.setItem('p828.lastSync', String(S.lastSync));
  } catch (e) {
    if (!S.token) { render(); return; }
    S.offline = true;
    if (!quiet) toast(navigator.onLine ? e.message : 'No connection. Showing saved info.');
  } finally {
    S.syncing = false; render();
  }
}

function signOutLocal() {
  S.token = ''; S.data = null;
  ['p828.token', 'p828.data', 'p828.lastSync', 'p828.scout'].forEach(k => localStorage.removeItem(k));
  S.loginStep = 'email'; render();
}

/* ---------- Shell ---------- */
function render() {
  const app = $('#app');
  if (API_URL.indexOf('PASTE_') === 0) { app.innerHTML = setupNeeded(); return; }
  if (!S.token) { app.innerHTML = loginView(); mountGoogle(); return; }

const RANKS = ['Lion', 'Tiger', 'Wolf', 'Bear', 'Webelos', 'Arrow of Light'];
const ik = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\b(adventure|adventures|award|awards|requirements)\b/g, ' ').replace(/\s+/g, ' ').trim();

/* One scout's advancement grouped by rank: earned rank, each adventure (earned or in progress) and its signed-off requirements */
function advTree(name) {
  const cat = {}; ((D().lists || {}).adventures || []).forEach(a => { cat[a.rank + '|' + ik(a.name)] = a.type; });
  const groups = {};
  const G = k => (groups[k] = groups[k] || { key: k, earned: null, items: {}, rankReqs: [] });
  const I = (k, item) => { const g = G(k), key = ik(item); return (g.items[key] = g.items[key] || { key, name: item, group: k, done: null, app: null, reqs: [], type: cat[k + '|' + key] || '' }); };

    if (a.type === 'Rank') { G(a.rank || a.item.replace(/\s+rank$/i, '')).earned = a; return; }
    const it = I(a.type === 'Award' ? 'Awards' : (a.rank || 'Other'), a.item);
    if (a.source === 'Scoutbook' || !it.done) it.done = a;
    if (a.source !== 'Scoutbook') it.app = a;
  });
  (D().requirements || []).filter(r => r.scout === name).forEach(r => {
    if (r.kind === 'Rank') { G(r.rank).rankReqs.push(r); return; }
    I(r.kind === 'Award' ? 'Awards' : (r.rank || 'Other'), r.item).reqs.push(r);
  });
  return RANKS.filter(r => groups[r]).concat(['Awards', 'Other'].filter(k => groups[k])).map(k => groups[k]);
}

  }).join('');

/* Shrink phone photos before upload so they send fast on weak signal */
async function fileToPayload(file) {
  if (!file) return null;
  if (file.type.startsWith('image/')) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
      return { mime: 'image/jpeg', data: await toB64(blob) };
    } catch (e) { /* fall through to raw upload */ }
  }
  if (file.size > 10 * 1024 * 1024) throw new Error('That file is over 10 MB. Take a photo instead.');
  return { mime: file.type || 'application/octet-stream', data: await toB64(file) };
}
function toB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(blob); });
}

/* ---------- Sign in with Google ---------- */
function mountGoogle() {
  const box = $('#gbtn'); if (!box || !googleOn()) return;
  if (window.google && google.accounts && google.accounts.id) {
    if (!mountGoogle.ready) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential, ux_mode: 'popup', cancel_on_tap_outside: true });
      mountGoogle.ready = true;
    }
    google.accounts.id.renderButton(box, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'left', width: Math.min(360, box.clientWidth || 320) });
    return;
  }
  if (mountGoogle.loading) return;
  mountGoogle.loading = true;
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
  sc.onload = () => mountGoogle();
  sc.onerror = () => { mountGoogle.loading = false; const m = $('#msg'); if (m) m.textContent = 'Google sign-in could not load. Use an email code instead.'; };
  document.head.appendChild(sc);
}
async function onGoogleCredential(resp) {
  const m = $('#msg'); if (m) m.textContent = 'Signing in...';
  try {
    const r = await api('googleSignIn', { credential: resp.credential });
    S.token = r.token; localStorage.setItem('p828.token', r.token);
    S.tab = 'home'; render(); await refresh(false);
  } catch (e) { if (m) m.textContent = e.message; }
}

  newAnnouncement: newAnnouncementSheet,
  newTodo: newTodoSheet,
  newAdv: newAdvSheet,
  newExpense: newExpenseSheet,
  editBal: el => balanceSheet(el.dataset.scout || ''),
  expense: el => expenseSheet(el.dataset.id),
  advItem: el => advSheet(el.dataset.id),
  advDetail: el => advDetailSheet(el),
  expFilter: el => { S.expFilter = el.dataset.f; render(); },
  syncLedger: async el => {
    el.disabled = true; el.textContent = 'Syncing...';
    try { const r = await api('syncLedger'); toast('Synced ' + r.status.count + ' balances from the ledger'); await refresh(true); }
    catch (e) { toast(e.message); el.disabled = false; el.textContent = 'Sync now'; }
  },
  loginBack: () => { S.loginStep = 'email'; render(); },
  iosHint: () => { localStorage.setItem('p828.iosHint', '1'); render(); },
  install: async () => { if (!S.installEvt) return; S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt = null; render(); },
  signOut: async () => { if (!confirm('Sign out of Pack 828 on this phone?')) return; try { await api('signOut'); } catch (e) {} signOutLocal(); },
  delAnnouncement: async el => { if (!confirm('Remove this announcement for everyone?')) return; await run(() => api('deleteAnnouncement', { id: el.dataset.id }), 'Announcement removed'); },
  delTodo: async el => { if (!confirm('Delete this to-do?')) return; await run(() => api('deleteTodo', { id: el.dataset.id }), 'To-do deleted'); },
  delAdv: async el => { if (!confirm('Delete this entry?')) return; closeSheet(); await run(() => api('deleteAdvancement', { id: el.dataset.id }), 'Entry deleted'); },
  sbSet: async el => { closeSheet(); await run(() => api('markScoutbook', { ids: [el.dataset.id], value: el.dataset.v === '1' }), el.dataset.v === '1' ? 'Marked entered in Scoutbook' : 'Moved back to the Scoutbook to-do'); }
};
async function run(fn, okMsg) {
  try { await fn(); toast(okMsg); await refresh(true); } catch (e) { toast(e.message); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return;
  if (actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el, e); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.name === 'scouts' && el.checked && el.dataset.rank && el.form && el.form.rank && !el.form.rank.value) { el.form.rank.value = el.dataset.rank; fillAdvList(el.dataset.rank); }
  if (el.name === 'rank' && el.form && el.form.dataset.form === 'logAdvancement') fillAdvList(el.value);
  if (el.dataset.act === 'pickScout') { S.scout = el.value; localStorage.setItem('p828.scout', S.scout); render(); }
  if (el.dataset.act === 'receiptPick') {
    const f = el.files[0], img = $('#thumb');
    if (f && f.type.startsWith('image/')) { img.src = URL.createObjectURL(f); img.hidden = false; } else img.hidden = true;
    $('#rcpt-label').textContent = f ? (f.type.startsWith('image/') ? 'Change the receipt photo' : 'Attached: ' + f.name) : 'Add a receipt photo';
  }
  if (el.dataset.act === 'toggleTodo') {
    const t = (D().todos || []).find(x => x.id === el.dataset.id); if (!t) return;
    t.done = el.checked; render();
    try { await api('setTodo', { id: t.id, done: t.done }); toast(t.done ? 'Done' : 'Reopened'); refresh(true); }
    catch (err) { t.done = !t.done; render(); toast(err.message); }
  }
});

document.addEventListener('submit', async e => {
  const form = e.target, kind = form.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(form), btn = e.submitter || form.querySelector('[type=submit]'), err = form.querySelector('.err'), msg = $('#msg');
  const val = k => String(fd.get(k) || '').trim();
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Working...'; }
  if (err) err.hidden = true;
  try {
    if (kind === 'requestCode') {
      S.loginEmail = val('email').toLowerCase();
      await api('requestCode', { email: S.loginEmail });
      S.loginStep = 'code'; render(); return;
    }
    if (kind === 'verifyCode') {
      const r = await api('verifyCode', { email: S.loginEmail, code: val('code') });
      S.token = r.token; localStorage.setItem('p828.token', r.token);
      S.tab = 'home'; render(); await refresh(false); return;
    }
    if (kind === 'postAnnouncement') {
      const r = await api('postAnnouncement', { title: val('title'), body: val('body'), audience: val('audience'), expires: val('expires'), pinned: !!fd.get('pinned'), toChat: !!fd.get('toChat') });
      closeSheet(); toast(fd.get('toChat') && !r.chatSent ? 'Posted in the app. Google Chat did not accept it; check the webhook.' : 'Announcement posted');
    }
    if (kind === 'addTodo') { await api('addTodo', { task: val('task'), assignedTo: val('assignedTo') || U().email, due: val('due') }); closeSheet(); toast('To-do added'); }
    if (kind === 'logAdvancement') {
      const scouts = fd.getAll('scouts'); if (!scouts.length) throw new Error('Pick at least one scout.');
      const r = await api('logAdvancement', { scouts, rank: val('rank'), item: val('item'), date: val('date'), note: val('note') });
      closeSheet(); toast('Logged for ' + r.count + (r.count === 1 ? ' scout' : ' scouts'));
    }
    if (kind === 'setBalance') {
      const n = Number(val('balance').replace(/[$,\s]/g, '')); if (isNaN(n)) throw new Error('Enter the balance as a number, like 125.50');
      await api('setBalance', { scout: val('scout'), balance: n, note: val('note') }); closeSheet(); toast('Balance saved');
    }
    if (kind === 'submitExpense') {
      const amount = Number(val('amount').replace(/[$,\s]/g, '')); if (!(amount > 0)) throw new Error('Enter the amount spent, like 24.99');
      const file = form.querySelector('[name=receipt]').files[0];
      if (!file && !confirm('No receipt photo attached. Submit anyway?')) throw new Error('Add a photo of the receipt.');
      if (btn) btn.textContent = file ? 'Uploading receipt...' : 'Working...';
      const receipt = await fileToPayload(file);
      await api('submitExpense', { amount, date: val('date'), vendor: val('vendor'), category: val('category'), event: val('event'), paidWith: val('paidWith'), description: val('description'), receipt });
      closeSheet(); toast('Expense submitted to the treasurer');
    }
    if (kind === 'updateExpense') {
      const status = btn ? btn.value : '';
      await api('updateExpense', { id: form.dataset.id, status, note: val('note') }); closeSheet(); toast('Expense updated');
    }
    if (kind === 'markScoutbook') {
      const ids = fd.getAll('ids'); if (!ids.length) throw new Error('Tick the ones you entered in Scoutbook first.');
      await api('markScoutbook', { ids, value: true }); toast(ids.length + ' marked entered in Scoutbook');
    }
    await refresh(true);
  } catch (ex) {
    if (err) { err.textContent = ex.message; err.hidden = false; }
    else if (msg) msg.textContent = ex.message;
    else toast(ex.message);
  } finally {
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; }
  }
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.token && S.data) render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && Date.now() - S.lastSync > 5 * 60 * 1000) refresh(true); });
window.addEventListener('online', () => refresh(true));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

render();
if (S.token) refresh(!!S.data);
</script>
</body>
</html>
